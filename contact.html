<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a Free Quote | South Florida Dock and Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-2xl font-bold text-blue-900">South Florida Dock and Deck</a>
      <a href="tel:561-916-4617" class="text-blue-700 font-semibold">561-916-4617</a>
    </div>
  </header>
  <main class="max-w-2xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-center mb-8">Request Your Free Quote</h1>
    <form class="bg-white p-8 rounded-lg shadow space-y-4">
      <input type="text" placeholder="Full Name" class="w-full border p-3 rounded" required>
      <input type="tel" placeholder="Phone Number" class="w-full border p-3 rounded" required>
      <input type="email" placeholder="Email" class="w-full border p-3 rounded" required>
      <input type="text" placeholder="City / Zip Code" class="w-full border p-3 rounded" required>
      <select class="w-full border p-3 rounded" required>
        <option value="">Project Type</option>
        <option>Custom Dock</option>
        <option>Dock Repair / Pilings</option>
        <option>Motorized Pergola</option>
        <option>Composite Deck</option>
        <option>Combined Package</option>
      </select>
      <textarea placeholder="Project Details" class="w-full border p-3 rounded" rows="4"></textarea>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Schedule My Site Consultation</button>
    </form>
  </main>
</body>
</html>
